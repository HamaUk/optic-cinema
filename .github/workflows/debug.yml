name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Create local.properties
        run: |
          echo "TMDB_API_KEY=" > local.properties
          echo "RABBITSTREAM_SOURCE_API=" >> local.properties
          echo "SUBDL_API_KEY=" >> local.properties
          echo "APP_LAYOUT=auto" >> local.properties

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v3
        with:
          name: optic-cinema-debug
          path: app/build/outputs/apk/debug/*.apk
