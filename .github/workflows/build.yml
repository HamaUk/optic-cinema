name: Build Optic Cinema

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Quick Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Config
        run: |
          echo "TMDB_API_KEY=" > local.properties
          echo "RABBITSTREAM_SOURCE_API=" >> local.properties
          echo "SUBDL_API_KEY=" >> local.properties
          echo "APP_LAYOUT=auto" >> local.properties

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build APKs
        run: ./gradlew assembleDebug -x lint -x test --parallel --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: optic-cinema-app
          path: app/build/outputs/apk/debug/*.apk
